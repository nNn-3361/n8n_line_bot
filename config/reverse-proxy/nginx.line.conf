user nginx;
worker_processes 1;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format minimal '$time_iso8601 status=$status method=$request_method uri=$uri';
    access_log /dev/stdout minimal;

    server_tokens off;
    keepalive_timeout 10s;
    reset_timedout_connection on;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    large_client_header_buffers 2 8k;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    limit_req_zone $binary_remote_addr zone=webhook_rate:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=webhook_connections:1m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream line_verifier {
        server webhook-verifier:3000;
        keepalive 4;
    }

    server {
        listen 8080;
        server_name _;

        location = /webhook/line-events {
            if ($request_method != POST) {
                return 405;
            }

            if ($http_content_encoding != "") {
                return 415;
            }

            limit_req zone=webhook_rate burst=20 nodelay;
            limit_conn webhook_connections 20;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Line-Signature $http_x_line_signature;
            proxy_set_header Content-Type $http_content_type;

            proxy_request_buffering on;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_pass http://line_verifier/line-events;
        }

        location / {
            return 404;
        }
    }
}
